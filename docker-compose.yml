services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: mfscreener
      POSTGRES_PASSWORD: mfscreener
      POSTGRES_DB: mfscreener
    ports:
      - "5432:5432"
    volumes:
      - mf_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mfscreener -d mfscreener"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mfscreener
      MINIO_ROOT_PASSWORD: mfscreener-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - mf_minio:/data
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 mfscreener mfscreener-secret;
      mc mb -p local/mf-raw-amfi || true;
      exit 0;
      "

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://mfscreener:mfscreener@db:5432/mfscreener
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: mfscreener
      S3_SECRET_KEY: mfscreener-secret
      S3_BUCKET: mf-raw-amfi
      S3_REGION: us-east-1
      MFDATA_BASE_URL: https://mfdata.in
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    command: ["uvicorn", "mfscreener.api.main:app", "--host", "0.0.0.0", "--port", "8080"]

volumes:
  mf_pgdata:
  mf_minio:
