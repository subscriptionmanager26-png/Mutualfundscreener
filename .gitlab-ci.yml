stages:
  - test
  - ingest

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

default:
  image: python:3.12-slim
  before_script:
    - pip install -e ".[dev]"

test:
  stage: test
  script:
    - pytest -q

# Optional scheduled pipeline on a runner with local Postgres + DATABASE_URL
nightly-ingest:
  stage: ingest
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - mf-job migrate
    - mf-job run-nightly
